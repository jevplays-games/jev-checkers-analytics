name: Checkers tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm test
      - run: npm run bench -- --pairs 2 --profile easy --opponent random --max-plies 120 --out bench/results/ci-smoke
