<style>

*{box-sizing:border-box}html,body{margin:0;width:1280px;height:420px;overflow:hidden}body{color:#1E1E1E;font-family:VT323,'JetBrains Mono',monospace}.banner{position:relative;width:1280px;height:420px;overflow:hidden;background:#F386A1;isolation:isolate}.texture{position:absolute;inset:0;z-index:-1}.frame{position:absolute;inset:24px;border:1px solid #1E1E1E}.crop{position:absolute;width:14px;height:14px;border:solid #1E1E1E;border-width:0}.tl{top:12px;left:12px;border-width:1px 0 0 1px}.tr{top:12px;right:12px;border-width:1px 1px 0 0}.bl{bottom:12px;left:12px;border-width:0 0 1px 1px}.br{bottom:12px;right:12px;border-width:0 1px 1px 0}

</style></head><body>

iv><div class="square white"></div><div class="square grey"><i class="piece pink"></i></div><div class="square white"></div><div class="square white"></div><div class="square grey"><i class="piece pink"></i></div><div class="square white"></div><div class="square grey"><i class="piece pink"></i></div><div class="square white"></div><div class="square grey"><i class="piece pink"></i></div><div class="square white"></div><div class="square grey"><i class="piece pink"></i></div><div class="square grey"><i class="piece pink"></i></div><div class="square white"></div><div class="square grey"><i class="piece pink"></i></div><div class="square white"></div><div class="square grey"><i class="piece pink"></i></div><div class="square white"></div><div class="square grey"><i class="piece pink"></i></div><div class="square white"></div></div></section>
